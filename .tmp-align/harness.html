<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body { margin: 0; padding: 16px; background: #f5f5f5; }
      .col { width: 272px; display: flex; flex-direction: column; gap: 12px; }
    </style>
  </head>
  <body>
    <div class="col" id="col"></div>
    <script>
      // Exact class strings copied from PromptCard.tsx
      const ROW = 'flex items-start gap-1 p-2';
      const ICONCOL =
        'mr-1 flex shrink-0 flex-col items-center gap-0.5 pt-2 empty:hidden';
      const TITLE =
        'min-w-0 flex-1 cursor-pointer pt-1 text-left text-sm font-medium text-card-foreground';

      const flag = `<span title="High priority" class="inline-flex"><svg data-icon="priority" role="img" aria-label="High priority" fill="currentColor" class="size-3.5 shrink-0 text-red-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg></span>`;
      const status = `<span title="Working" class="inline-flex shrink-0"><svg data-icon="status" role="img" aria-label="Working" class="size-3.5 text-sky-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>`;
      const btn = (name) =>
        `<div data-btn="${name}" class="inline-flex items-center justify-center size-7 shrink-0 rounded-md"><svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/></svg></div>`;

      function card(label, title, icons) {
        return `
          <div data-case="${label}" class="rounded-md border border-border bg-card shadow-sm">
            <div class="${ROW}">
              <div class="${ICONCOL}">${icons}</div>
              <div role="button" class="${TITLE}"><span class="line-clamp-2">${title}</span></div>
              ${btn('copy')}
              ${btn('expand')}
            </div>
          </div>`;
      }

      const short = 'Short title';
      const long =
        'A much longer card title that will definitely wrap onto two lines';

      document.getElementById('col').innerHTML = [
        card('1line-both', short, flag + status),
        card('2line-both', long, flag + status),
        card('1line-priority', short, flag),
        card('2line-priority', long, flag),
        card('1line-status', short, status),
        card('2line-status', long, status),
        card('1line-none', short, ''),
        card('2line-none', long, ''),
      ].join('');
    </script>
  </body>
</html>
